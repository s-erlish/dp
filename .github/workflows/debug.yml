name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      # Every branch the work has lived on. A workflow that builds only yesterday's branch produces
      # no artefact for today's, and the fix nobody can install is indistinguishable from no fix.
      - claude/app-audit-agents-hyyftk
      - claude/project-analysis-status-9cefax
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;28.2.13676358" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build libhev-socks5-tunnel (tun2socks native lib)
        run: bash compile-hevtun.sh

      - name: Copy libhev-socks5-tunnel into app
        run: cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.12
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Grant gradlew permission
        working-directory: V2rayNG
        run: chmod +x ./gradlew

      # A debug APK is signed with AGP's auto-generated ~/.android/debug.keystore, and a
      # GitHub-hosted runner is a fresh VM, so every run used to sign with a DIFFERENT identity:
      # build N+1 then refuses to install over build N (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and the
      # tester loses every server, subscription and their session to an uninstall. Restoring the same
      # keystore keeps one identity across runs; a cache miss is harmless, Gradle just makes a fresh
      # key exactly as it does today. Same cache key as release.yml on purpose — one CI identity.
      - name: Restore the CI debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: departament-ci-debug-keystore-v1

      - name: Build debug APK (arm64-v8a, playstore only)
        working-directory: V2rayNG
        run: ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: departament-debug-apk
          path: V2rayNG/app/build/outputs/apk/**/*arm64-v8a*.apk
