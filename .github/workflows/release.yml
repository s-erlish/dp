name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      # Every branch the work has lived on. A workflow that builds only yesterday's branch produces
      # no artefact for today's, and the fix nobody can install is indistinguishable from no fix.
      - claude/app-audit-agents-hyyftk
      - claude/project-analysis-status-9cefax
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;28.2.13676358" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build libhev-socks5-tunnel (tun2socks native lib)
        run: bash compile-hevtun.sh

      - name: Copy libhev-socks5-tunnel into app
        run: cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.12
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Grant gradlew permission
        working-directory: V2rayNG
        run: chmod +x ./gradlew

      # The identity this APK is signed with. Without one of the two branches below,
      # app/build.gradle.kts leaves the release UNSIGNED on purpose — and an unsigned APK cannot be
      # installed on any Android device at all ("App not installed" / apksigner: "Missing
      # META-INF/MANIFEST.MF"). This step used to be missing entirely while the build step was still
      # titled "debug-signed", which is how the branch shipped an artefact nobody could install.
      #
      # Real key first: DEPARTAMENT_* is what build.gradle.kts reads, APP_KEYSTORE_* is the secret
      # set the repo already carries for build.yml. Fall back to the documented
      # -PdebugSignedRelease escape hatch, so the output is always installable.
      - name: Prepare release signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          if [ -n "$APP_KEYSTORE_BASE64" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/departament-release.jks"
            {
              echo "DEPARTAMENT_KEYSTORE=$RUNNER_TEMP/departament-release.jks"
              echo "DEPARTAMENT_KEYSTORE_PASSWORD=$APP_KEYSTORE_PASSWORD"
              echo "DEPARTAMENT_KEY_ALIAS=$APP_KEYSTORE_ALIAS"
              echo "DEPARTAMENT_KEY_PASSWORD=$APP_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "No APP_KEYSTORE_BASE64 secret; falling back to the debug key for a test build."
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi

      # Only reached on the debug-key fallback, and only because a debug key that is regenerated per
      # runner makes build N+1 refuse to install over build N (INSTALL_FAILED_UPDATE_INCOMPATIBLE),
      # which costs the tester every server, subscription and their session. Restoring the same
      # ~/.android/debug.keystore keeps one identity across runs. A cache miss is harmless: Gradle
      # creates a fresh key exactly as it does today.
      - name: Restore the CI debug keystore
        if: env.SIGNING == 'debug-key'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: departament-ci-debug-keystore-v1

      - name: Build release APK (arm64-v8a, playstore only)
        working-directory: V2rayNG
        run: |
          if [ "$SIGNING" = "release-key" ]; then
            ./gradlew assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a
          else
            ./gradlew assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a -PdebugSignedRelease=true
          fi

      # An artefact that cannot be installed must not be published looking like one that can.
      # build.gradle.kts tags an unsigned release `-unsigned` in the filename precisely so this
      # check is one glob; apksigner then proves the APK actually carries a signature.
      - name: Refuse to publish an uninstallable APK
        run: |
          set -e
          apk=$(find V2rayNG/app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::no APK was produced"; exit 1; fi
          case "$apk" in
            *-unsigned.apk)
              echo "::error::$apk is UNSIGNED and cannot be installed on any device."
              exit 1;;
          esac
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -n 1)
          if [ -x "$signer" ]; then
            "$signer" verify --print-certs "$apk" \
              || { echo "::error::$apk carries no valid signature"; exit 1; }
          else
            echo "note: apksigner not on this runner; relied on the filename check alone."
          fi
          echo "installable artefact: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: departament-release-apk
          path: V2rayNG/app/build/outputs/apk/**/*arm64-v8a*.apk
